<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東江ガス タスク発注管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#002a78;--navy-light:#003a9e;--navy-dark:#001a4e;
  --gold:#ffd740;--gold-dark:#c8a800;--gold-light:#ffe680;
  --bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text-sub:#666;
  --green:#2e7d32;--green-bg:#e8f5e9;
  --orange:#e65100;--orange-bg:#fff3e0;
  --red:#c62828;--red-bg:#ffebee;
  --blue:#1565c0;--blue-bg:#e3f2fd;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--navy-dark),var(--navy))}
.login-box{background:#fff;border-radius:var(--radius);padding:48px 40px;width:90%;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h1{color:var(--navy);font-size:1.5rem;margin-bottom:8px}
.login-box p{color:var(--text-sub);font-size:.9rem;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;border:2px solid #ddd;border-radius:8px;font-size:1rem;font-family:inherit;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--navy)}
.login-box button{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;transition:background .2s}
.login-box button:hover{background:var(--navy-light)}
.login-err{color:var(--red);font-size:.85rem;margin-top:12px;display:none}

/* HEADER */
#app{display:none}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.header h1 .badge{background:var(--gold);color:var(--navy);font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header-right .role{font-size:.8rem;opacity:.8}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b71c1c}
.btn-sm{padding:6px 12px;font-size:.8rem}

/* SUMMARY */
.summary-bar{background:#fff;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;border-bottom:1px solid #e0e0e0}
.summary-card{padding:16px;border-radius:var(--radius);background:var(--bg)}
.summary-card .label{font-size:.75rem;color:var(--text-sub);margin-bottom:4px}
.summary-card .value{font-size:1.5rem;font-weight:900;color:var(--navy)}
.summary-card .value.gold{color:var(--gold-dark)}

/* TABS */
.tabs{display:flex;padding:0 24px;background:#fff;border-bottom:1px solid #e0e0e0;overflow-x:auto}
.tab{padding:14px 20px;font-size:.9rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:var(--text-sub);white-space:nowrap;transition:all .2s}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.tab:hover{color:var(--navy)}

/* CONTENT */
.content{padding:24px;max-width:1200px;margin:0 auto}
.section-title{font-size:1rem;font-weight:700;color:var(--navy);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}

/* TASK CARD */
.task-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--navy);transition:transform .15s}
.task-card:hover{transform:translateY(-1px)}
.task-card.approved{border-left-color:var(--green);background:var(--green-bg)}
.task-card.held{border-left-color:var(--orange);background:var(--orange-bg)}
.task-card.rejected{border-left-color:var(--red);background:var(--red-bg)}
.task-card.completed{border-left-color:#9e9e9e;background:#fafafa}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.task-title{font-weight:700;font-size:.95rem;flex:1}
.task-price{font-weight:900;font-size:1.1rem;color:var(--navy);white-space:nowrap}
.task-meta{display:flex;gap:12px;margin-top:8px;font-size:.8rem;color:var(--text-sub);flex-wrap:wrap}
.task-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.task-actions .btn{font-size:.8rem;padding:6px 14px}
.btn-approve{background:var(--green);color:#fff}
.btn-approve:hover{background:#1b5e20}
.btn-hold{background:var(--orange);color:#fff}
.btn-hold:hover{background:#bf360c}
.btn-reject{background:var(--red);color:#fff}
.btn-reject:hover{background:#b71c1c}
.btn-reset{background:#9e9e9e;color:#fff}
.btn-reset:hover{background:#757575}
.status-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.status-badge.approved{background:var(--green);color:#fff}
.status-badge.held{background:var(--orange);color:#fff}
.status-badge.rejected{background:var(--red);color:#fff}
.status-badge.completed{background:#9e9e9e;color:#fff}

/* COMPLETED LIST */
.completed-item{background:var(--card);border-radius:8px;padding:14px 20px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #9e9e9e;flex-wrap:wrap;gap:8px}
.completed-item .ci-title{font-weight:500;font-size:.9rem}
.completed-item .ci-right{display:flex;gap:16px;align-items:center;font-size:.85rem;color:var(--text-sub)}
.completed-item .ci-price{font-weight:700;color:var(--navy)}

/* CLOSE MONTH MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:32px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.2rem;color:var(--navy);margin-bottom:16px}
.modal p{font-size:.9rem;margin-bottom:12px;line-height:1.6}
.modal-actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}

/* RESPONSIVE */
@media(max-width:768px){
  .header{padding:12px 16px}
  .header h1{font-size:1rem}
  .summary-bar{padding:16px;grid-template-columns:1fr 1fr;gap:12px}
  .summary-card .value{font-size:1.2rem}
  .content{padding:16px}
  .task-top{flex-direction:column}
  .tabs{padding:0 12px}
  .tab{padding:12px 14px;font-size:.85rem}
  .login-box{padding:32px 24px}
}
@media(max-width:480px){
  .summary-bar{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <h1>東江ガス株式会社</h1>
    <p>タスク発注管理システム</p>
    <input type="password" id="pw-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">ログイン</button>
    <div class="login-err" id="login-err">パスワードが正しくありません</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div class="header">
    <h1>東江ガス タスク管理 <span class="badge">53周年</span></h1>
    <div class="header-right">
      <span class="role" id="role-label"></span>
      <button class="btn btn-gold" onclick="showExportModal()" id="btn-csv">📥 CSV出力</button>
      <button class="btn btn-outline" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-bar" id="summary-bar"></div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- CONTENT -->
  <div class="content" id="content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<script>
(function(){
'use strict';

/* ========== CONFIG ========== */
var STORAGE_KEY = 'agariegas_tasks_v15';
var SESSION_KEY = 'agariegas_session';
var CLOSED_KEY = 'agariegas_closed_v1';
var BASE_WORK_KEY = 'agariegas_basework_v2';

var BASE_CONF = {price:100000, totalHours:20, hourlyRate:5000};
var CARRYOVER = {price:100000, hours:20, hourlyRate:5000, applyMonth:'apr'};
var ACTIVE_MONTHS = ['apr','may','jun'];
var MONTH_LABELS = {apr:'2026年4月', may:'2026年5月', jun:'2026年6月'};

var PASSWORDS = {
  'makoto2026': {role:'admin', label:'管理者（まこと）'},
  'agarie2026': {role:'viewer', label:'閲覧者（東江常務）'}
};

/* ========== COMPLETED DATA ========== */
var COMPLETED_APR = [
  {title:'ショート動画A 制作・配信', price:80000, date:'2026-04-01', label:'完了済み'},
  {title:'当選者発表ページ関連（ページ作成、リスト導入）', price:20000, date:'2026-04-15', label:'完了済み'}
];

var COMPLETED_MAY = [
  {title:'HP管理会社（セルラー）とのHP公開やりとり', price:5000, date:'2026-04-15', label:'1h × ¥5,000'},
  {title:'当選者データ入力日付変更対応', price:5000, date:'2026-04-16', label:'1h × ¥5,000'},
  {title:'当選者データ修正対応', price:5000, date:'2026-04-20', label:'1h × ¥5,000'},
  {title:'ミーティング（予算&キャラクター活用マニュアル）', price:5000, date:'2026-04-23', label:'1h × ¥5,000'}
];

/* ========== DEFAULT TASKS ========== */
var DEFAULT_TASKS = [
  {id:2, title:'ショート動画B（キャラクターネーミング表記＆PRお披露目動画）', price:80000, deadline:'2026-04-15', status:'none', month:'apr'},
  {id:7, title:'Instagram公式アカウント 立ち上げ・初回投稿（ショート動画Bを投稿予定）', price:30000, deadline:'2026-04-15', status:'none', month:'apr'},
  {id:8, title:'キャラクター紹介ページ（当選者発表ページに追加）', price:20000, deadline:'2026-04-30', status:'none', month:'apr'},
  {id:9, title:'キャラクター活用マニュアル（企画書）', price:15000, deadline:'2026-04-30', status:'none', month:'apr'},
  {id:10, title:'キャラクターバナー制作（PC・SP各2パターン）', price:40000, deadline:'2026-05-15', status:'none', month:'may'},
  {id:11, title:'地域情報誌掲載用バナー（キャラクター発表・マンスリーうらそえ5月号）', price:20000, deadline:'2026-05-01', status:'none', month:'may'},
  {id:12, title:'動画制作技術指導（東江ガス社員向け）', price:30000, deadline:'2026-05-31', status:'none', month:'may'},
  {id:13, title:'次期キャンペーン企画立案（キャラクター活用）', price:25000, deadline:'2026-05-31', status:'none', month:'may'}
];

/* ========== STATE ========== */
var currentUser = null;
var currentMonth = 'apr';
var tasks = [];

/* ========== UTILITIES ========== */
function formatPrice(n) {
  var val = (n == null || isNaN(n)) ? 0 : Number(n);
  return '\u00a5' + val.toLocaleString();
}

function formatDate(d) {
  if (!d) return '-';
  var parts = d.split('-');
  if (parts.length < 3) return d;
  return parts[1].replace(/^0/,'') + '/' + parts[2].replace(/^0/,'');
}

function $(id) { return document.getElementById(id); }

/* ========== STORAGE ========== */
function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch(e) {
    console.warn('saveTasks error:', e);
  }
}

function loadTasks() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        tasks = parsed;
        return;
      }
    }
  } catch(e) {
    console.warn('loadTasks error:', e);
  }
  // Fallback: use defaults
  tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  saveTasks();
}

function getClosedMonths() {
  try {
    var raw = localStorage.getItem(CLOSED_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function setClosedMonth(m, data) {
  var closed = getClosedMonths();
  closed[m] = data;
  try {
    localStorage.setItem(CLOSED_KEY, JSON.stringify(closed));
  } catch(e) {}
}

function getBaseWork() {
  try {
    var raw = localStorage.getItem(BASE_WORK_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function setBaseWork(m, items) {
  var bw = getBaseWork();
  bw[m] = items;
  try {
    localStorage.setItem(BASE_WORK_KEY, JSON.stringify(bw));
  } catch(e) {}
}

/* ========== AUTH ========== */
function doLogin() {
  var pw = $('pw-input').value.trim();
  var user = PASSWORDS[pw];
  if (!user) {
    $('login-err').style.display = 'block';
    $('pw-input').value = '';
    return;
  }
  currentUser = user;
  try { sessionStorage.setItem(SESSION_KEY, pw); } catch(e) {}
  $('login-screen').style.display = 'none';
  $('app').style.display = 'block';
  loadTasks();
  render();
}

function doLogout() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  currentUser = null;
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('pw-input').value = '';
  $('login-err').style.display = 'none';
}

function tryAutoLogin() {
  try {
    var pw = sessionStorage.getItem(SESSION_KEY);
    if (pw && PASSWORDS[pw]) {
      currentUser = PASSWORDS[pw];
      $('login-screen').style.display = 'none';
      $('app').style.display = 'block';
      loadTasks();
      render();
    }
  } catch(e) {}
}

/* ========== TASK ACTIONS ========== */
function setStatus(id, status) {
  if (!currentUser || currentUser.role !== 'admin') return;
  for (var i = 0; i < tasks.length; i++) {
    if (tasks[i].id === id) {
      tasks[i].status = status;
      break;
    }
  }
  saveTasks();
  render();
}

/* ========== CALCULATIONS ========== */
function calcMonth(m) {
  var monthTasks = tasks.filter(function(t){ return t.month === m; });
  var approved = monthTasks.filter(function(t){ return t.status === 'approved'; });
  var held = monthTasks.filter(function(t){ return t.status === 'held'; });
  var pending = monthTasks.filter(function(t){ return t.status === 'none'; });
  var rejected = monthTasks.filter(function(t){ return t.status === 'rejected'; });

  var approvedTotal = approved.reduce(function(s,t){ return s + (t.price || 0); }, 0);

  // Get completed items for this month
  var completedItems = [];
  var completedTotal = 0;
  if (m === 'apr') {
    completedItems = COMPLETED_APR;
  } else if (m === 'may') {
    completedItems = COMPLETED_MAY;
  }
  completedTotal = completedItems.reduce(function(s,c){ return s + (c.price || 0); }, 0);

  // Base contract
  var base = BASE_CONF.price;
  var carry = (CARRYOVER.applyMonth === m) ? CARRYOVER.price : 0;

  // Total billing = base + carry + approved tasks + completed
  var billing = base + carry + approvedTotal + completedTotal;

  return {
    monthTasks: monthTasks,
    approved: approved,
    held: held,
    pending: pending,
    rejected: rejected,
    approvedTotal: approvedTotal,
    completedItems: completedItems,
    completedTotal: completedTotal,
    base: base,
    carry: carry,
    billing: billing
  };
}

/* ========== RENDER ========== */
function render() {
  if (!currentUser) return;

  // Role label
  $('role-label').textContent = currentUser.label;

  // Hide admin-only elements for viewers
  if (currentUser.role !== 'admin') {
    $('btn-csv').style.display = 'none';
  } else {
    $('btn-csv').style.display = '';
  }

  // Tabs
  var tabsHtml = '';
  ACTIVE_MONTHS.forEach(function(m) {
    var cls = m === currentMonth ? 'tab active' : 'tab';
    tabsHtml += '<div class="' + cls + '" onclick="switchMonth(\'' + m + '\')">' + MONTH_LABELS[m] + '</div>';
  });
  $('tabs').innerHTML = tabsHtml;

  // Calc current month
  var c = calcMonth(currentMonth);
  var closed = getClosedMonths();
  var isClosed = !!closed[currentMonth];

  // Summary bar
  var summaryHtml = '';
  summaryHtml += '<div class="summary-card"><div class="label">基本契約</div><div class="value">' + formatPrice(c.base) + '</div></div>';
  if (c.carry > 0) {
    summaryHtml += '<div class="summary-card"><div class="label">繰越金額</div><div class="value">' + formatPrice(c.carry) + '</div></div>';
  }
  summaryHtml += '<div class="summary-card"><div class="label">承認済みタスク</div><div class="value">' + formatPrice(c.approvedTotal) + '</div></div>';
  summaryHtml += '<div class="summary-card"><div class="label">完了済み業務</div><div class="value">' + formatPrice(c.completedTotal) + '</div></div>';
  summaryHtml += '<div class="summary-card"><div class="label">請求合計</div><div class="value gold">' + formatPrice(c.billing) + '</div></div>';
  $('summary-bar').innerHTML = summaryHtml;

  // Content
  var html = '';

  // Closed notice
  if (isClosed) {
    html += '<div style="background:var(--gold-light);padding:16px;border-radius:var(--radius);margin-bottom:20px;font-weight:700;color:var(--navy)">✅ ' + MONTH_LABELS[currentMonth] + 'は締め済みです（' + closed[currentMonth].closedAt + '）</div>';
  }

  // Active tasks
  if (c.monthTasks.length > 0) {
    html += '<div class="section-title">📋 発注タスク（' + c.monthTasks.length + '件）</div>';

    // Group by status
    var groups = [
      {key:'none', label:'未対応', items: c.pending},
      {key:'approved', label:'承認済み', items: c.approved},
      {key:'held', label:'保留中', items: c.held},
      {key:'rejected', label:'見送り', items: c.rejected}
    ];

    groups.forEach(function(g) {
      if (g.items.length === 0) return;
      html += '<div style="font-size:.85rem;color:var(--text-sub);margin:16px 0 8px;font-weight:700">' + g.label + '（' + g.items.length + '件）</div>';

      g.items.forEach(function(t) {
        var cardClass = 'task-card';
        if (t.status === 'approved') cardClass += ' approved';
        else if (t.status === 'held') cardClass += ' held';
        else if (t.status === 'rejected') cardClass += ' rejected';

        html += '<div class="' + cardClass + '">';
        html += '<div class="task-top">';
        html += '<div class="task-title">' + escHtml(t.title) + '</div>';
        html += '<div class="task-price">' + formatPrice(t.price) + '</div>';
        html += '</div>';
        html += '<div class="task-meta">';
        html += '<span>📅 期限: ' + formatDate(t.deadline) + '</span>';
        if (t.status !== 'none') {
          var badgeCls = 'status-badge ' + t.status;
          var badgeText = t.status === 'approved' ? '承認' : t.status === 'held' ? '保留' : '見送り';
          html += '<span class="' + badgeCls + '">' + badgeText + '</span>';
        }
        html += '</div>';

        // Actions (admin only, not closed)
        if (currentUser.role === 'admin' && !isClosed) {
          html += '<div class="task-actions">';
          if (t.status !== 'approved') {
            html += '<button class="btn btn-approve" onclick="setStatus(' + t.id + ',\'approved\')">✅ 承認</button>';
          }
          if (t.status !== 'held') {
            html += '<button class="btn btn-hold" onclick="setStatus(' + t.id + ',\'held\')">⏸ 保留</button>';
          }
          if (t.status !== 'rejected') {
            html += '<button class="btn btn-reject" onclick="setStatus(' + t.id + ',\'rejected\')">❌ 見送り</button>';
          }
          if (t.status !== 'none') {
            html += '<button class="btn btn-reset" onclick="setStatus(' + t.id + ',\'none\')">↩ 戻す</button>';
          }
          html += '</div>';
        }
        html += '</div>';
      });
    });
  }

  // Completed items
  if (c.completedItems.length > 0) {
    html += '<div class="section-title">✅ 完了済み業務（' + c.completedItems.length + '件）</div>';
    c.completedItems.forEach(function(ci) {
      html += '<div class="completed-item">';
      html += '<div class="ci-title">' + escHtml(ci.title) + '</div>';
      html += '<div class="ci-right">';
      html += '<span>' + formatDate(ci.date) + '</span>';
      html += '<span class="ci-price">' + formatPrice(ci.price) + '</span>';
      if (ci.label) html += '<span style="font-size:.75rem;color:var(--text-sub)">' + escHtml(ci.label) + '</span>';
      html += '</div></div>';
    });
  }

  // Billing summary
  html += '<div class="section-title">💰 請求サマリー</div>';
  html += '<div style="background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">';
  html += '<table style="width:100%;border-collapse:collapse;font-size:.9rem">';
  html += row('基本契約（月額）', formatPrice(c.base));
  if (c.carry > 0) html += row('繰越金額', formatPrice(c.carry));
  html += row('完了済み業務', formatPrice(c.completedTotal));
  html += row('承認済みタスク', formatPrice(c.approvedTotal));
  html += '<tr style="border-top:2px solid var(--navy)"><td style="padding:12px 0;font-weight:900;font-size:1.1rem">請求合計</td><td style="padding:12px 0;text-align:right;font-weight:900;font-size:1.1rem;color:var(--gold-dark)">' + formatPrice(c.billing) + '</td></tr>';
  html += '</table></div>';

  // Admin actions
  if (currentUser.role === 'admin' && !isClosed) {
    html += '<div style="margin-top:24px;text-align:right">';
    html += '<button class="btn btn-danger" onclick="showCloseMonthModal()">🔒 ' + MONTH_LABELS[currentMonth] + 'を締める</button>';
    html += '</div>';
  }

  $('content').innerHTML = html;
}

function row(label, value) {
  return '<tr><td style="padding:8px 0;border-bottom:1px solid #eee">' + label + '</td><td style="padding:8px 0;text-align:right;font-weight:700;border-bottom:1px solid #eee">' + value + '</td></tr>';
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ========== TABS ========== */
window.switchMonth = function(m) {
  currentMonth = m;
  render();
};

/* ========== CLOSE MONTH ========== */
function showCloseMonthModal() {
  var c = calcMonth(currentMonth);
  var pending = c.pending;
  var html = '<h2>🔒 月末締め確認</h2>';
  html += '<p><strong>' + MONTH_LABELS[currentMonth] + '</strong>を締めます。</p>';
  html += '<p>請求合計: <strong style="color:var(--gold-dark)">' + formatPrice(c.billing) + '</strong></p>';
  if (pending.length > 0) {
    html += '<p style="color:var(--orange)">⚠ 未対応タスクが' + pending.length + '件あります。締め後は変更できません。</p>';
  }
  html += '<div class="modal-actions">';
  html += '<button class="btn btn-outline" style="color:var(--text);border-color:#ccc" onclick="closeModal()">キャンセル</button>';
  html += '<button class="btn btn-danger" onclick="executeCloseMonth()">締め確定</button>';
  html += '</div>';
  $('modal-body').innerHTML = html;
  $('modal-overlay').classList.add('show');
}

window.executeCloseMonth = function() {
  var now = new Date();
  var dateStr = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  var c = calcMonth(currentMonth);
  setClosedMonth(currentMonth, {
    closedAt: dateStr,
    billing: c.billing,
    approvedTotal: c.approvedTotal,
    completedTotal: c.completedTotal
  });
  closeModal();
  render();
};

/* ========== CSV EXPORT ========== */
function showExportModal() {
  var html = '<h2>📥 CSVエクスポート</h2>';
  html += '<p>エクスポートする月を選択してください。</p>';
  html += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">';
  ACTIVE_MONTHS.forEach(function(m) {
    html += '<button class="btn btn-gold" style="width:100%" onclick="exportCSV(\'' + m + '\')">' + MONTH_LABELS[m] + '</button>';
  });
  html += '<button class="btn" style="width:100%;background:var(--navy);color:#fff" onclick="exportCSV(\'all\')">全期間</button>';
  html += '</div>';
  html += '<div class="modal-actions"><button class="btn btn-outline" style="color:var(--text);border-color:#ccc" onclick="closeModal()">閉じる</button></div>';
  $('modal-body').innerHTML = html;
  $('modal-overlay').classList.add('show');
}

window.exportCSV = function(target) {
  var months = target === 'all' ? ACTIVE_MONTHS : [target];
  var lines = ['種別,タスク名,金額,期限/日付,ステータス,月'];

  months.forEach(function(m) {
    var c = calcMonth(m);
    // Active tasks
    c.monthTasks.forEach(function(t) {
      var statusText = t.status === 'approved' ? '承認' : t.status === 'held' ? '保留' : t.status === 'rejected' ? '見送り' : '未対応';
      lines.push('発注タスク,"' + (t.title||'').replace(/"/g,'""') + '",' + (t.price||0) + ',' + (t.deadline||'') + ',' + statusText + ',' + MONTH_LABELS[m]);
    });
    // Completed
    c.completedItems.forEach(function(ci) {
      lines.push('完了済み,"' + (ci.title||'').replace(/"/g,'""') + '",' + (ci.price||0) + ',' + (ci.date||'') + ',完了,' + MONTH_LABELS[m]);
    });
    // Summary row
    lines.push('請求合計,,,,' + formatPrice(c.billing) + ',' + MONTH_LABELS[m]);
  });

  var bom = '\uFEFF';
  var blob = new Blob([bom + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '東江ガス_タスク管理_' + target + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
};

/* ========== MODAL ========== */
function closeModal() {
  $('modal-overlay').classList.remove('show');
}

/* ========== GLOBAL ========== */
window.doLogin = doLogin;
window.doLogout = doLogout;
window.setStatus = setStatus;
window.showCloseMonthModal = showCloseMonthModal;
window.showExportModal = showExportModal;
window.closeModal = closeModal;

/* ========== INIT ========== */
tryAutoLogin();

})();
</script>
</body>
</html>
