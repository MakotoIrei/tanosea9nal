window.showClose=function(){var apT=approvedTotal();var curBill=AUG_TOTAL+apT;var h='<h2>\ud83d\udd12 \u8acb\u6c42\u78ba\u5b9a\uff08\u4eca\u6708\uff09</h2>';h+='<p>今月（2026年10月）\u8acb\u6c42\u4e88\u5b9a\uff1a<strong>'+fp(curBill)+'</strong></p>';var pe=tasks.filter(function(t){return t.status==='none'||t.status==='held';}).length;if(pe>0)h+='<p style="color:var(--orange)">\u26a0 \u672a\u78ba\u8a8d '+pe+'\u4ef6</p>';h+='<div class="macts"><button class="mb cn" onclick="closeMo()">\u9589\u3058\u308b</button></div>';$('mbox').innerHTML=h;$('mo').classList.add('show');};
window.showExport=function(){var lines=['\u533a\u5206,\u5185\u5bb9,\u91d1\u984d,\u65e5\u4ed8,\u30b9\u30c6\u30fc\u30bf\u30b9'];WIP.forEach(function(i){lines.push('制作中（11月以降）,"'+(i.t||'').replace(/"/g,'""')+'",'+(i.p||0)+',,'+(i.tag||''));});PROV.forEach(function(i){lines.push('今月（完成しだい）,"'+(i.t||'').replace(/"/g,'""')+'",'+(i.p||0)+',,'+(i.tag||''));});AUG.forEach(function(i){lines.push('今月（10月）,"'+(i.t||'').replace(/"/g,'""')+'",'+(i.p||0)+','+(i.d||'')+','+(i.tag||''));});SEP.forEach(function(i){lines.push('来月（11月）,"'+(i.t||'').replace(/"/g,'""')+'",'+(i.p||0)+','+(i.d||'')+','+(i.tag||''));});approvedList().forEach(function(t){lines.push('\u4eca\u6708\u627f\u8a8d\u5358\u767a,"'+(t.title||'').replace(/"/g,'""')+'",'+(t.price||0)+',,\u627f\u8a8d');});pendingList().forEach(function(t){var st=t.status==='held'?'\u4fdd\u7559':t.status==='rejected'?'\u898b\u9001\u308a':'\u672a\u5bfe\u5fdc';lines.push('\u5358\u767a\u767a\u6ce8,"'+(t.title||'').replace(/"/g,'""')+'",'+(t.price||0)+',,'+st);});ARCHIVE.forEach(function(a){lines.push('\u5b9f\u7e3e\u8acb\u6c42\u6e08,"'+a.m+'",'+a.billed+',,\u8acb\u6c42\u6e08\u307f');});var blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download='\u6771\u6c5f\u30ac\u30b9_\u5358\u767a\u696d\u52d9_'+(new Date().toISOString().slice(0,10))+'.csv';a.click();URL.revokeObjectURL(u);};
window.closeMo=function(){$('mo').classList.remove('show');};
})();
